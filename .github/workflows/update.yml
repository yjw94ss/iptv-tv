name: update-iptv

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 03:17 UTC 更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载源数据
        run: |
          mkdir -p work
          curl -L --retry 3 -o work/guovin_cn.m3u \
            https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u
          curl -L --retry 3 -o work/myepg.gz \
            https://gitee.com/mytv-android/myepg/raw/master/output/epg.gz
          curl -L --retry 3 -o work/pp.xml \
            https://epg.112114.xyz/pp.xml
          curl -L --retry 3 -o work/fm_e.xml \
            https://raw.githubusercontent.com/fanmingming/live/main/e.xml
          curl -L --retry 3 -o work/index.country.m3u \
            https://iptv-org.github.io/iptv/index.country.m3u
          curl -L --retry 3 -o work/world_guide.xml.gz \
            https://fehmi.github.io/world-epg/guide.xml.gz

      - name: 生成清单与节目单
        run: |
          python3 scripts/build_cn.py
          python3 scripts/build_world.py

      - name: 提交更新
        run: |
          git config user.name  github-actions[bot]
          git config user.email  github-actions[bot]@users.noreply.github.com
          git add cn world
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 更新直播源与节目单 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:main
          fi
